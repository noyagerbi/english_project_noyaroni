<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Word Quest - Vocabulary Game</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    min-height: 100dvh;
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(32px, 8vw, 58px);
    margin: 10px 0;
}

.subtitle {
    font-size: 18px;
    opacity: 0.9;
}

.card {
    background: rgba(255,255,255,0.97);
    color: #222;
    border-radius: 24px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.modes {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.mode-button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #e9e9e9;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.mode-button.active {
    background: #667eea;
    color: white;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 25px;
}

.stat {
    background: #f2f3ff;
    padding: 12px;
    border-radius: 14px;
    text-align: center;
}

.stat-number {
    display: block;
    font-size: 25px;
    font-weight: bold;
    color: #667eea;
}

.question {
    text-align: center;
    margin: 25px 0;
}

.question-label {
    color: #777;
    font-size: 14px;
    margin-bottom: 8px;
}

.word {
    font-size: clamp(32px, 9vw, 55px);
    font-weight: bold;
    color: #333;
    word-break: break-word;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.answer {
    width: 100%;
    min-height: 58px;
    padding: 15px 18px;
    border: 2px solid #ddd;
    border-radius: 14px;
    background: white;
    color: #222;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
    transition: 0.15s;
}

.answer:hover {
    border-color: #667eea;
    background: #f5f6ff;
}

.answer.correct {
    background: #d8f8df;
    border-color: #35a853;
}

.answer.wrong {
    background: #ffe0e0;
    border-color: #e53935;
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.control {
    flex: 1;
    min-height: 50px;
    border: none;
    border-radius: 12px;
    background: #667eea;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.control.secondary {
    background: #eee;
    color: #333;
}

.message {
    text-align: center;
    min-height: 30px;
    margin-top: 18px;
    font-weight: bold;
}

.start-screen,
.end-screen {
    text-align: center;
}

.start-screen h2,
.end-screen h2 {
    font-size: 30px;
}

.start-button {
    width: 100%;
    min-height: 58px;
    border: none;
    border-radius: 14px;
    background: #667eea;
    color: white;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

.hidden {
    display: none;
}

.score-big {
    font-size: 55px;
    color: #667eea;
    font-weight: bold;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .card {
        padding: 18px;
        border-radius: 18px;
    }

    .modes {
        flex-direction: column;
    }

    .stats {
        gap: 7px;
    }

    .stat {
        padding: 9px 4px;
    }

    .stat-number {
        font-size: 21px;
    }

    .controls {
        flex-direction: column;
    }

    .answer {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🎯 Word Quest</h1>
    <div class="subtitle">An interactive vocabulary adventure</div>
</header>

<div class="card">

<!-- START SCREEN -->
<div id="startScreen" class="start-screen">

    <h2>Ready to test your vocabulary?</h2>

    <p>
        Choose a game mode and challenge yourself with
        English vocabulary.
    </p>

    <div class="modes">
        <button class="mode-button active" onclick="setMode('hebrew', this)">
            English → Hebrew
        </button>

        <button class="mode-button" onclick="setMode('definition', this)">
            English → Definition
        </button>
    </div>

    <button class="start-button" onclick="startGame()">
        Start Game 🚀
    </button>

</div>


<!-- GAME SCREEN -->
<div id="gameScreen" class="hidden">

    <div class="stats">

        <div class="stat">
            <span>Score</span>
            <span id="score" class="stat-number">0</span>
        </div>

        <div class="stat">
            <span>Lives</span>
            <span id="lives" class="stat-number">❤️❤️❤️</span>
        </div>

        <div class="stat">
            <span>Streak</span>
            <span id="streak" class="stat-number">0</span>
        </div>

    </div>

    <div class="question">

        <div class="question-label">
            What does this word mean?
        </div>

        <div id="word" class="word"></div>

    </div>

    <div id="answers" class="answers"></div>

    <div id="message" class="message"></div>

    <div class="controls">

        <button class="control" onclick="speakWord()">
            🔊 Hear Word
        </button>

        <button class="control secondary" onclick="showHint()">
            💡 Hint
        </button>

    </div>

</div>


<!-- END SCREEN -->
<div id="endScreen" class="end-screen hidden">

    <h2>🎉 Game Complete!</h2>

    <p>Your final score:</p>

    <div id="finalScore" class="score-big">0</div>

    <p id="finalMessage"></p>

    <button class="start-button" onclick="restartGame()">
        Play Again
    </button>

</div>

</div>

</div>


<script>

const words = [

["bottom","תחתון / בתחתית","at the lowest part"],
["chase","מרדף","an act of trying to catch someone"],
["coach","לאמן / להדריך","to train or teach someone"],
["earthquake","רעידת אדמה","a sudden shaking of the ground"],
["fire","לפטר","to make someone leave a job"],
["formal","רשמי","official or suitable for serious occasions"],
["free","בחינם","without paying"],
["headquarters","מטה / מפקדה","the main office of an organization"],
["laugh","צחוק","the sound or action of laughing"],
["look","מראה / הופעה","the way someone or something appears"],
["or so","בערך / או משהו כזה","approximately"],
["raw","נא / לא מבושל","not cooked"],
["trick","טריק / תרגיל","a clever action used to fool someone"],
["victim","קורבן","a person harmed by an event or action"],
["weakness","חולשה","a lack of strength"],

["every once in a while","מדי פעם","sometimes, but not often"],
["attraction","אטרקציה / משיכה","something that attracts people"],
["cycle","לרכוב על אופניים","to ride a bicycle"],
["get in touch","ליצור קשר","to contact someone"],
["marvelous","נפלא / נהדר","extremely good or enjoyable"],
["might as well","כדאי כבר / אפשר גם","used when there is no good reason not to do something"],
["position","עמדה / תפקיד / מיקום","a place, role, or situation"],
["shelter","מחסה","a safe place that protects you"],
["side","צד","one of the parts or surfaces of something"],
["spill","לשפוך","to accidentally make liquid come out"],
["struggle","מאבק / קושי","a difficult effort or fight"],
["subway","רכבת תחתית","an underground train system"],
["swear","להישבע","to make a serious promise"],
["transfer","להעביר","to move something from one place or person to another"],
["via","דרך / באמצעות","by way of; through"],

["cash","לפדות / להמיר למזומן","to exchange a check for money"],
["cover","לכסות","to put something over something else"],
["cyberbullying","בריונות ברשת","bullying using the internet or digital devices"],
["do a good/excellent job","לעשות עבודה טובה / מצוינת","to do something well"],
["firm","יציב / נוקשה","strong and not easily moved or changed"],
["idiom","ביטוי / ניב","a phrase whose meaning is different from its literal words"],
["in turn","בתורו / בתורה","as a result or one after another"],
["pace","קצב","the speed at which something happens"],
["reserve","להזמין / לשמור מקום","to arrange for something to be kept for you"],
["server","שרת","a computer that provides data or services"],
["symbol","סמל","a sign or object representing an idea"],
["tight","צמוד / הדוק","fitting closely"],
["touch","מגע","the act or sense of touching"],
["turn somebody/something into","להפוך מישהו/משהו ל...","to change someone or something into something else"],
["weird","מוזר","strange or unusual"],

["ambition","שאפתנות / שאיפה","a strong desire to achieve something"],
["be just about to do something","לעמוד בדיוק לעשות משהו","to be going to do something very soon"],
["beat","קצב / פעימה","a regular pulse or rhythm"],
["can tell","יכול לדעת / יכול להבחין","can understand or recognize"],
["courage","אומץ","the ability to face fear or difficulty"],
["enter","להיכנס","to go into a place"],
["float","לצוף","to stay on the surface of a liquid"],
["fortune","מזל / הון","luck or a large amount of money"],
["log off/out","להתנתק / לצאת מהחשבון","to end a session on a computer or website"],
["message","הודעה / מסר","information sent to someone"],
["partner","שותף / בת זוג","a person you work or do something with"],
["spread","ממרח / פריסה","food or something spread over a surface"],
["take pleasure/pride/an interest","ליהנות / להתגאות / להתעניין","to enjoy, feel proud of, or become interested in something"],
["terminal","מסוף / תחנה סופית","a place where a journey begins or ends"],
["tight","בחוזקה","firmly or closely"],

["at his/its best","בשיאו / במיטבו","in the best possible condition"],
["cheat","לרמות","to act dishonestly to gain an advantage"],
["disabled","אדם עם מוגבלות","a person with a disability"],
["follow","לעקוב / ללכת אחרי","to go after or come after someone or something"],
["for the sake of","למען","for the benefit or purpose of someone or something"],
["load","לטעון / להעמיס","to put something into or onto something"],
["miss","פספוס / החטאה","a failure to hit, catch, or reach something"],
["punish","להעניש","to make someone suffer a consequence for wrongdoing"],
["spread","להפיץ / להתפשט","to move or cause something to move over a larger area"],
["suspect","חשוד","a person believed to have committed a crime"],
["that's it","זהו / זה הכול","that is all; nothing more"],
["tough","קשוח / קשה","strong, difficult, or able to deal with difficulty"],
["wear something out","לשחוק / להתיש","to use something until it is damaged or to make someone tired"],
["weigh","לשקול","to measure how heavy something is"],
["whatever","כלשהו / לא משנה איזה","any thing or things, no matter which"],

["as a matter of fact","למעשה / למעשה כן","used to add information or correct something"],
["bend","לכופף","to make something curve or change shape"],
["deposit","פיקדון / מקדמה","money paid or placed somewhere in advance"],
["disabled","מוגבל / בעל מוגבלות","having a condition that limits an ability"],
["free","חופשי","not controlled or not costing money"],
["grab","לחטוף / לתפוס","to take or hold suddenly"],
["here you are / here it is","הנה לך / הנה זה","used when giving something to someone"],
["lightly","בעדינות / בקלילות","gently or with little force"],
["name","שם","a word used to identify a person or thing"],
["pour","למזוג / לשפוך","to make liquid flow from one container to another"],
["show up","להופיע / להגיע","to arrive or become visible"],
["sink","לשקוע","to go down below the surface"],
["special offer","הצעה מיוחדת","a special deal at a reduced or attractive price"],
["warm","לחמם","to make something warmer"],
["Who cares?","למי אכפת?","used to say something is not important to you"],

["argue","להתווכח","to disagree with someone by speaking angrily or strongly"],
["capacity","קיבולת / יכולת","the maximum amount something can contain or do"],
["cure","לרפא","to make an illness go away"],
["deaf","חירש / כבד שמיעה","unable to hear or unable to hear well"],
["escape","בריחה","an act of getting away from a place or danger"],
["free will","רצון חופשי","the ability to choose freely"],
["lonely","בודד","sad because you are alone or lack company"],
["quit","להפסיק / לפרוש","to stop doing something"],
["shaming","ביוש / השפלה","the act of making someone feel ashamed"],
["signal","אות / סימן","a sign used to communicate information"],
["strike","להכות / לפגוע","to hit someone or something"],
["suspect","לחשוד","to think something is probably true or someone did something wrong"],
["tribe","שבט","a social group with shared culture or ancestry"],
["underline","להדגיש בקו תחתון","to draw a line under words"],
["weather forecast","תחזית מזג האוויר","a report about expected weather"],

["annoy","לעצבן","to make someone slightly angry"],
["bold","נועז / מודגש","brave or visually strong"],
["casual","לא רשמי / יומיומי","relaxed and not formal"],
["cure","תרופה / מרפא","a treatment that makes an illness better or disappear"],
["debt","חוב","money that someone owes"],
["fare","דמי נסיעה / מחיר נסיעה","the money paid for a journey"],
["give up something / give something up","לוותר על משהו","to stop having or doing something"],
["layer","שכבה","one level or thickness covering something"],
["loan","הלוואה","money borrowed that must be paid back"],
["mark","סימן / ציון","a visible sign or a grade"],
["modest","צנוע","not talking proudly about your abilities or achievements"],
["peaceful","שליו / רגוע","calm and without violence"],
["race","מרוץ / תחרות","a competition to see who is fastest"],
["some kind of","איזשהו סוג של","a particular but not clearly identified type of"],
["strengthen","לחזק","to make stronger"]

];


let mode = "hebrew";
let deck = [];
let current = 0;
let score = 0;
let lives = 3;
let streak = 0;
let answered = false;


function setMode(newMode, button) {

    mode = newMode;

    document.querySelectorAll(".mode-button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
}


function shuffle(array) {

    return [...array].sort(() => Math.random() - 0.5);

}


function startGame() {

    deck = shuffle(words);
    current = 0;
    score = 0;
    lives = 3;
    streak = 0;
    answered = false;

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("endScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    updateStats();
    showQuestion();

}


function restartGame() {
    startGame();
}


function updateStats() {

    document.getElementById("score").textContent = score;

    document.getElementById("streak").textContent = streak;

    document.getElementById("lives").textContent =
        "❤️".repeat(lives) + "🖤".repeat(3 - lives);

}


function showQuestion() {

    if (lives <= 0 || current >= deck.length) {
        endGame();
        return;
    }

    answered = false;

    const item = deck[current];

    document.getElementById("word").textContent = item[0];

    document.getElementById("message").textContent = "";

    const correct =
        mode === "hebrew" ? item[1] : item[2];

    let options = [correct];

    while (options.length < 4) {

        const random =
            words[Math.floor(Math.random() * words.length)];

        const option =
            mode === "hebrew" ? random[1] : random[2];

        if (!options.includes(option)) {
            options.push(option);
        }

    }

    options = shuffle(options);

    const container =
        document.getElementById("answers");

    container.innerHTML = "";

    options.forEach(option => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent = option;

        button.onclick = () =>
            checkAnswer(button, option, correct);

        container.appendChild(button);

    });

}


function checkAnswer(button, selected, correct) {

    if (answered) return;

    answered = true;

    const buttons =
        document.querySelectorAll(".answer");

    if (selected === correct) {

        button.classList.add("correct");

        score += 10 + streak * 2;

        streak++;

        document.getElementById("message").textContent =
            "✅ Correct! Great job!";

    } else {

        button.classList.add("wrong");

        lives--;

        streak = 0;

        buttons.forEach(btn => {

            if (btn.textContent === correct) {
                btn.classList.add("correct");
            }

        });

        document.getElementById("message").textContent =
            "❌ Not quite! The correct answer is: " + correct;

    }

    updateStats();

    setTimeout(() => {

        current++;
        showQuestion();

    }, 1200);

}


function showHint() {

    if (answered) return;

    const item = deck[current];

    const hint =
        mode === "hebrew" ? item[2] : item[1];

    document.getElementById("message").textContent =
        "💡 Hint: " + hint;

}


function speakWord() {

    const word = deck[current][0];

    if ("speechSynthesis" in window) {

        const speech =
            new SpeechSynthesisUtterance(word);

        speech.lang = "en-US";

        window.speechSynthesis.speak(speech);

    }

}


function endGame() {

    document.getElementById("gameScreen")
        .classList.add("hidden");

    document.getElementById("endScreen")
        .classList.remove("hidden");

    document.getElementById("finalScore")
        .textContent = score;

    let message = "";

    if (score >= 1000) {
        message = "Amazing! You really know your vocabulary! 🌟";
    } else if (score >= 600) {
        message = "Great job! Keep practicing! 🎉";
    } else {
        message = "Good effort! Try again and beat your score! 💪";
    }

    document.getElementById("finalMessage")
        .textContent = message;

}

</script>

</body>
</html>
